<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="assets/css/gridSys.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/icon/fontawesome-6.4.0/css/all.min.css">

    <link rel="icon" href="assets/img/me.jpg" type="image/x-icon"/>

</head>
<body>
    <header class = "header">
        <div class="grid wide">
            <div class="row header__first">
                <div class="header__contact">
                    <ul class="contact-list">
                        <li class="contact-item">
                            <i class="fa-solid fa-phone contact-item-icon" ></i>
                            <a href="#" class="contact-item-link">0904298243</a>
                        </li>
                        <li class="contact-item">
                            <i class="fa-solid fa-envelope contact-item-icon" ></i>
                            <a href="#" class="contact-item-link">anhnv22.work@gmail.com</a>
                        </li>
                    </ul>
                    <ul class="contact-list">
                        <li class="contact-item">
                            <a href="#" class="contact-item-link">
                                <i class="contact-item-icon fa-brands fa-facebook-f"></i>
                            </a>
                        </li>
                        <li class="contact-item">
                            <a href="#" class="contact-item-link">
                                <i class="contact-item-icon fa-brands fa-twitter"></i>
                            </a>
                        </li>
                        <li class="contact-item">
                            <a href="#" class="contact-item-link">
                                <i class="contact-item-icon fa-brands fa-square-instagram"></i>
                            </a>
                        </li>
                        <li class="contact-item">
                            <a href="#" class="contact-item-link">
                                <i class="contact-item-icon fa-brands fa-github"></i>
                            </a>
                        </li>
                        <li class="contact-item">
                            <a href="#" class="contact-item-link">
                                <i class="contact-item-icon fa-brands fa-linkedin-in"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="row header__middle">
                <div class="col xl-4 md-12 sm-12">
                    <div class="header__logo">
                        <a href="#" class="header__logo-link">
                            <img src="assets/img/logo.png" alt="logo" class="header__logo-img">
                        </a>
                        <div class="header__logo-country-wrap">
                            <button class="header__logo-country">
                                Việt Nam
                                <i class="fa-solid fa-sort-down"></i>
                            </button>
                            <ul class="header__logo-country-list">
                                <li class="header__logo-country-item">Nhật Bản</li>
                                <li class="header__logo-country-item">Hàn Quốc</li>
                            </ul>
                        </div>
                        <div class="header__logo-money-wrap">
                            <button class="header__logo-money">
                                VNĐ
                                <i class="fa-solid fa-sort-down"></i>
                            </button>
                            <ul class="header__logo-money-list">
                                <li class="header__logo-money-item">Yên</li>
                                <li class="header__logo-money-item">Won</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col xl-8 md-12 sm-12 ">
                    <div class="header__menu">
                        <ul class="header__menu-list">
                            <li class="header__menu-item"> 
                                <a href="#" class="header__menu-link">
                                    <i class="fa-solid fa-user"></i>
                                    <p class="header__menu-content">Account</p>
                                </a>
                            </li>
                            <li class="header__menu-item"> 
                                <a href="#" class="header__menu-link">
                                    <i class="fa-solid fa-star"></i>
                                    <p class="header__menu-content">Favorite</p>
                                </a>
                            </li>
                            <li class="header__menu-item"> 
                                <a href="#" class="header__menu-link">
                                    <i class="fa-regular fa-credit-card"></i>
                                    <p class="header__menu-content">Purchase</p>
                                </a>
                            </li>
                            <li class="header__menu-item"> 
                                <a href="#" class="header__menu-link">
                                    <i class="fa-solid fa-cart-shopping"></i>
                                    <p class="header__menu-content">Cart</p>
                                </a>
                            </li>
                            <li class="header__menu-item"> 
                                <a href="#" class="header__menu-link">
                                    <i class="fa-solid fa-lock"></i>
                                    <p class="header__menu-content">Login</p>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="row header__end">
                <div class="col xl-8">
                    <ul class="header__control-list">
                        <li class="header__control-item">
                            <a href="#" class="header__control-link">Home</a>
                        </li>
                        <li class="header__control-item">
                            <a href="#" class="header__control-link">
                                <span>Shop</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </a>
                        </li>
                        <li class="header__control-item">
                            <a href="#" class="header__control-link">
                                <span>Block</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </a>
                        </li>
                        <li class="header__control-item">
                            <a href="#" class="header__control-link">Contact</a>
                        </li>
                    </ul>
                </div>
                <div class="col xl-4">
                    <div class="header__control-search">
                        <input type="text" placeholder="Search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                </div>

            </div>
        </div>
    </header>
</body>
</html>
